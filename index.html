<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;
            height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-bottom: 30px;
            color: #333333;
        }
        p {
            font-size: 14px;
            color: #666666;
            margin: 10px 0;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        button {
            padding: 12px 25px;
            background-color: #007BFF;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        #weatherResult {
            font-size: 16px;
            color: #2c3e50;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Weather Dashboard</h2>
        <input type="text" id="cityInput" placeholder="Enter the city...">
        <button onclick="getWeather()">Get Weather</button>

        <div class="result-box">
            <span id="weatherResult">Weather information will appear here.</span>
        </div>
    </div>

    <script>     //its works in the logic of the weather dashboard
        function getWeather() {
            let city = document.getElementById('cityInput').value.trim();
            if (!city) {
                alert("Please enter a city name!");
                return;         
            }

            document.getElementById('weatherResult').innerText = "Fetching weather data...";

            // Move the Python backend

            fetch('/get-weather' , {
                method: 'POST',                    // Send a POST request to the backend (Internet request)
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ city: city })
            })
            .then(response => response.json())
            .then(data => {

                if (data.error) {
                    document.getElementById('weatherResult').innerText = "Error: " + data.error;
                    return;
                }

                // Show the weather data in the result box from javascript
                document.getElementById('weatherResult').innerText = data.weather;
            })
            .catch(error => {
                console.error('Error fetching weather data:', error);
                document.getElementById('weatherResult').innerText = "Error fetching weather data.";
            });

        }
    </script>
</body>
    
</html>
